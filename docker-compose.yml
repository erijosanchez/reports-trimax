
services:
  # Aplicación Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trimax-app
    container_name: trimax_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - trimax-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: trimax_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - trimax-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: trimax_mysql
    command: --disable-log-bin
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - trimax-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # Redis
  redis:
    image: redis:7-alpine
    container_name: trimax_redis
    restart: unless-stopped
    # Sin publicar: solo accesible dentro de trimax-network ("redis:6379").
    # Para depurar desde el host: docker exec -it trimax_redis redis-cli -a "$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - trimax-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Laravel Horizon (Queue Worker)
  horizon:
    image: trimax-app
    container_name: trimax_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan horizon
    networks:
      - trimax-network
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Laravel Scheduler (Cron)
  scheduler:
    image: trimax-app
    container_name: trimax_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    networks:
      - trimax-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # phpMyAdmin (Opcional) — no arranca con "docker compose up -d" a secas.
  # Usar: docker compose --profile tools up -d
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: trimax_phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql
      # Sin PMA_USER/PMA_PASSWORD: pide credenciales, ya no entra como root
      # sin login.
    networks:
      - trimax-network
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Redis Commander (Opcional) — mismo profile que phpMyAdmin.
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trimax_redis_commander
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    networks:
      - trimax-network
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  trimax-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local