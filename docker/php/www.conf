[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500

; Timeouts críticos para archivos grandes
request_terminate_timeout = 300s
slowlog = /proc/self/fd/2
request_slowlog_timeout = 300s

; Logs — a stdout/stderr (I9), no a un archivo que nadie leía dentro del
; contenedor. Mismo criterio que ya usa "slowlog" arriba.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Healthcheck (I7): responde "pong" a una petición FastCGI de ping,
; sin pasar por el framework. Usado por el healthcheck del contenedor "app".
ping.path = /ping